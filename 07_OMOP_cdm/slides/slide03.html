<section class="slide" id="slide03">
    <div class="slide-content left" style="max-width: 1200px; width: 100%;">
        <h2 style="text-align: center; margin-bottom: var(--space-xl);">Comunidad OHDSI Global</h2>
        
        <div style="position: relative; width: 100%; height: 75vh; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-top: var(--space-md);">
            <!-- Image Container -->
            <div style="position: relative; width: 100%; height: calc(100% - 60px); display: flex; justify-content: center; align-items: center; background: #f8fafc; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: var(--shadow-md);">
                
                <!-- Base Image: Previa -->
                <img src="images/slide_03_collaborators_ohdsi_prev.png" alt="Collaborators Prev" class="slide-image" style="position: absolute; max-height: 100%; max-width: 100%; z-index: 0; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); margin: 0;">
                
                <!-- Overlay Image: 2026 -->
                <img src="images/slide_03_collaborators_ohdsi_apr2026.png" id="slide3-img1" alt="Collaborators 2026" class="slide-image" style="position: absolute; max-height: 100%; max-width: 100%; z-index: 1; opacity: 0; transition: opacity 0.3s ease; margin: 0;">
                
            </div>

            <!-- Slider Control -->
            <div style="width: 80%; max-width: 500px; margin-top: var(--space-xl); text-align: center; background: white; padding: 15px 25px; border-radius: 50px; box-shadow: var(--shadow-md); border: 1px solid #e2e8f0;">
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--color-gray-600); margin-bottom: 8px; font-weight: bold;">
                    <span>Previo</span>
                    <span>Actualidad (2026)</span>
                </div>
                <input type="range" id="ohdsi-map-slider" min="0" max="1" value="0" step="0.01" style="width: 100%; cursor: pointer; accent-color: var(--color-primary);" oninput="document.getElementById('slide3-img1').style.opacity = this.value;">
            </div>
        </div>
    </div>
</section>
