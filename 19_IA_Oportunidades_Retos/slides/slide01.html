<!-- Slide 01: Portada -->
<section class="slide active" id="slide01">
    <div class="slide-content center" style="max-width: 1200px; width: 100%; display: grid; grid-template-columns: 1.2fr 1fr; gap: var(--space-2xl); align-items: center;">
        
        <!-- Left Side: Title & Description -->
        <div style="text-align: left; display: flex; flex-direction: column; gap: var(--space-lg);">
            <div style="font-size: 1.2rem; font-weight: 700; color: var(--color-cta); text-transform: uppercase; letter-spacing: 0.15em; font-family: 'Roboto Mono', monospace;">
                Módulo 19
            </div>
            <h1 style="color: var(--color-primary); font-size: calc(3rem + 1vw); line-height: 1.1; font-weight: 800; font-family: 'Exo', sans-serif; margin: 0;">
                IA en la Medicina Moderna
            </h1>
            <h3 style="color: var(--color-secondary); font-size: 1.8rem; font-weight: 400; margin: 0; font-family: 'Exo', sans-serif; line-height: 1.4;">
                De la base matemática a la práctica clínica ética y segura.
            </h3>
            <p class="text-muted" style="font-size: 1.1rem; line-height: 1.6; color: var(--color-secondary); margin-top: var(--space-sm);">
                Un recorrido desde los fundamentos algorítmicos hasta la confianza médica, analizando la IA generativa, los modelos de lenguaje y la evaluación estricta en el sector salud.
            </p>
            
            <div style="display: flex; gap: var(--space-md); margin-top: var(--space-lg);">
                <button class="btn-primary" style="padding: 14px 28px; font-size: 1.1rem;"
                    onclick="document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowRight'}))">
                    Comenzar Presentación
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
                <a href="../index.html" class="btn-secondary" style="border: 2px solid var(--color-primary); padding: 12px 28px; border-radius: 8px; font-family: 'Exo', sans-serif; font-weight: 600; background: white; display: inline-flex; align-items: center; justify-content: center; color: var(--color-primary); font-size: 1.1rem;">
                    Volver al Directorio
                </a>
            </div>
        </div>

        <!-- Right Side: Interactive SVG Neural Network -->
        <div style="display: flex; justify-content: center; align-items: center; position: relative;">
            <svg width="100%" height="450" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width: 450px;">
                <defs>
                    <linearGradient id="grad-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
                        <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8" />
                    </linearGradient>
                    <linearGradient id="node-glow" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3B82F6" />
                        <stop offset="100%" stop-color="#1D4ED8" />
                    </linearGradient>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.2" />
                    </filter>
                    <style>
                        .pulse-line {
                            stroke-dasharray: 8 8;
                            animation: dash 30s linear infinite;
                        }
                        @keyframes dash {
                            to {
                                stroke-dashoffset: -1000;
                            }
                        }
                        .node-circle {
                            transition: transform 0.3s ease, fill 0.3s ease;
                        }
                        .node-circle:hover {
                            transform: scale(1.25);
                            fill: #06B6D4;
                            cursor: pointer;
                        }
                        .pulse-circle {
                            animation: glow-pulse 3s ease-in-out infinite alternate;
                        }
                        @keyframes glow-pulse {
                            0% { r: 12px; opacity: 0.3; }
                            100% { r: 20px; opacity: 0.8; }
                        }
                    </style>
                </defs>

                <!-- Connections (Lines) -->
                <!-- Input to Hidden Layer -->
                <line x1="80" y1="100" x2="250" y2="70" stroke="url(#grad-pulse)" stroke-width="2" class="pulse-line" />
                <line x1="80" y1="100" x2="250" y2="150" stroke="#E2E8F0" stroke-width="1.5" />
                <line x1="80" y1="100" x2="250" y2="230" stroke="#E2E8F0" stroke-width="1.5" />
                <line x1="80" y1="100" x2="250" y2="310" stroke="#E2E8F0" stroke-width="1.5" />

                <line x1="80" y1="200" x2="250" y2="70" stroke="#E2E8F0" stroke-width="1.5" />
                <line x1="80" y1="200" x2="250" y2="150" stroke="url(#grad-pulse)" stroke-width="2" class="pulse-line" />
                <line x1="80" y1="200" x2="250" y2="230" stroke="url(#grad-pulse)" stroke-width="2" class="pulse-line" />
                <line x1="80" y1="200" x2="250" y2="310" stroke="#E2E8F0" stroke-width="1.5" />

                <line x1="80" y1="300" x2="250" y2="70" stroke="#E2E8F0" stroke-width="1.5" />
                <line x1="80" y1="300" x2="250" y2="150" stroke="#E2E8F0" stroke-width="1.5" />
                <line x1="80" y1="300" x2="250" y2="230" stroke="#E2E8F0" stroke-width="1.5" />
                <line x1="80" y1="300" x2="250" y2="310" stroke="url(#grad-pulse)" stroke-width="2" class="pulse-line" />

                <!-- Hidden to Output Layer -->
                <line x1="250" y1="70" x2="420" y2="150" stroke="url(#grad-pulse)" stroke-width="2" class="pulse-line" />
                <line x1="250" y1="70" x2="420" y2="250" stroke="#E2E8F0" stroke-width="1.5" />

                <line x1="250" y1="150" x2="420" y2="150" stroke="url(#grad-pulse)" stroke-width="2" class="pulse-line" />
                <line x1="250" y1="150" x2="420" y2="250" stroke="#E2E8F0" stroke-width="1.5" />

                <line x1="250" y1="230" x2="420" y2="150" stroke="#E2E8F0" stroke-width="1.5" />
                <line x1="250" y1="230" x2="420" y2="250" stroke="url(#grad-pulse)" stroke-width="2" class="pulse-line" />

                <line x1="250" y1="310" x2="420" y2="150" stroke="#E2E8F0" stroke-width="1.5" />
                <line x1="250" y1="310" x2="420" y2="250" stroke="url(#grad-pulse)" stroke-width="2" class="pulse-line" />

                <!-- Pulsing outer glows for key nodes -->
                <circle cx="250" cy="150" r="15" fill="#06B6D4" class="pulse-circle" />
                <circle cx="420" cy="150" r="15" fill="#2563EB" class="pulse-circle" />

                <!-- Node Circles -->
                <!-- Input Layer -->
                <circle cx="80" cy="100" r="10" fill="#3F3F46" class="node-circle" />
                <circle cx="80" cy="200" r="10" fill="#3F3F46" class="node-circle" />
                <circle cx="80" cy="300" r="10" fill="#3F3F46" class="node-circle" />

                <!-- Hidden Layer -->
                <circle cx="250" cy="70" r="12" fill="url(#node-glow)" filter="url(#shadow)" class="node-circle" transform-origin="250 70" />
                <circle cx="250" cy="150" r="12" fill="#06B6D4" filter="url(#shadow)" class="node-circle" transform-origin="250 150" />
                <circle cx="250" cy="230" r="12" fill="url(#node-glow)" filter="url(#shadow)" class="node-circle" transform-origin="250 230" />
                <circle cx="250" cy="310" r="12" fill="url(#node-glow)" filter="url(#shadow)" class="node-circle" transform-origin="250 310" />

                <!-- Output Layer -->
                <circle cx="420" cy="150" r="14" fill="#10B981" filter="url(#shadow)" class="node-circle" transform-origin="420 150" />
                <circle cx="420" cy="250" r="14" fill="url(#node-glow)" filter="url(#shadow)" class="node-circle" transform-origin="420 250" />
                
                <!-- SVG Text Labels -->
                <text x="80" y="75" fill="#71717A" font-size="10" font-family="'Roboto Mono', monospace" text-anchor="middle">Datos Clínicos</text>
                <text x="250" y="45" fill="#71717A" font-size="10" font-family="'Roboto Mono', monospace" text-anchor="middle">Procesamiento Red</text>
                <text x="420" y="125" fill="#71717A" font-size="10" font-family="'Roboto Mono', monospace" text-anchor="middle">Diagnóstico / Salida</text>
            </svg>
        </div>

    </div>
</section>
