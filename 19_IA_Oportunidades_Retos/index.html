<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19. Inteligencia Artificial en Salud — Oportunidades y Retos</title>
    <meta name="description"
        content="Módulo 19 del Diplomado Neurum 2026: Inteligencia Artificial en Salud. Oportunidades y retos, de los fundamentos algorítmicos a la confianza médica.">
    <!-- Relative path to global styles -->
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        .slide-image {
            max-width: 100%;
            max-height: 55vh;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            margin: var(--space-md) auto;
            border: 1px solid #E2E8F0;
            display: block;
        }

        /* Loading indicator */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1.5rem;
            color: var(--color-primary);
            transition: opacity 0.5s;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Custom presentation extensions */
        .agenda-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-lg);
            width: 100%;
            margin-top: var(--space-xl);
        }

        .agenda-card {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            padding: var(--space-xl);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .agenda-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--color-cta);
        }

        .agenda-card .icon-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #EFF6FF;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-md);
            color: var(--color-cta);
        }

        .timeline-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            width: 100%;
            margin-top: var(--space-2xl);
            padding: 0 var(--space-md);
        }

        .timeline-line {
            position: absolute;
            top: 30px;
            left: 5%;
            width: 90%;
            height: 4px;
            background: #E2E8F0;
            z-index: 1;
        }

        .timeline-node {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 22%;
            text-align: center;
            cursor: pointer;
        }

        .timeline-dot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            border: 4px solid #2563EB;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #2563EB;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .timeline-node:hover .timeline-dot {
            background: #2563EB;
            color: white;
            transform: scale(1.1);
            box-shadow: var(--shadow-md);
        }

        .timeline-content {
            margin-top: var(--space-md);
        }

        .timeline-content h4 {
            margin-bottom: var(--space-xs);
            font-size: 1.1rem;
            color: var(--color-primary);
        }

        .timeline-content p {
            font-size: 0.85rem;
            color: var(--color-secondary);
            line-height: 1.4;
        }

        .euler-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 350px;
            width: 100%;
        }

        .concept-card {
            background: white;
            padding: var(--space-md) var(--space-lg);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #E2E8F0;
            transition: all 200ms ease;
        }

        .concept-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--color-cta);
        }

        .pillar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: var(--space-lg);
            width: 100%;
            margin-top: var(--space-md);
        }

        .pillar-card {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: var(--space-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: var(--space-md);
            align-items: flex-start;
            transition: all 0.2s ease;
        }

        .pillar-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-cta);
        }

        .pillar-icon {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            background: #EFF6FF;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-cta);
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--space-md);
            font-size: 1.05rem;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .comparison-table th {
            background-color: var(--color-primary);
            color: white;
            padding: 14px 18px;
            font-family: 'Exo', sans-serif;
            text-align: left;
            font-weight: 600;
        }

        .comparison-table td {
            padding: 14px 18px;
            border-bottom: 1px solid #E2E8F0;
            color: var(--color-secondary);
        }

        .comparison-table tr:last-child td {
            border-bottom: none;
        }

        .comparison-table tr:hover {
            background-color: #F8FAFC;
        }

        .equation-block {
            background: #F8FAFC;
            padding: var(--space-md);
            border-radius: 8px;
            border-left: 4px solid var(--color-cta);
            margin: var(--space-md) 0;
            width: 100%;
            overflow-x: auto;
        }

        .future-grid {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: var(--space-sm);
            margin-top: var(--space-xl);
        }

        .future-card {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: var(--space-md) var(--space-sm);
            text-align: center;
            flex: 1;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .future-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-cta);
        }

        .future-letter {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--color-cta);
            margin-bottom: var(--space-xs);
            font-family: 'Exo', sans-serif;
        }

        .future-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: var(--space-xs);
        }

        .future-desc {
            font-size: 0.75rem;
            color: var(--color-secondary);
            line-height: 1.3;
        }

        /* Responsive spacing additions */
        .slide-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .slide-content.left {
            align-items: flex-start;
            text-align: left;
        }

        .slide-content.center {
            align-items: center;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">Cargando presentación...</div>

    <div class="presentation-container">

        <div id="slide-container" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
            <!-- Slides will be loaded dynamically -->
        </div>

        <div class="slide-controls">
            <button class="control-btn" id="prevSlide" disabled title="Anterior">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <span class="slide-counter" id="slideCounter">1 / 30</span>
            <button class="control-btn" id="nextSlide" title="Siguiente">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

    </div>

    <div id="modals-container">
        <!-- Modals will be loaded dynamically -->
    </div>

    <div class="modal-overlay" id="global-image-modal">
        <div class="modal modal-image-wrapper">
            <button class="modal-close modal-image-close" title="Cerrar Imagen">&times;</button>
            <img src="" id="global-image-content" class="modal-image-content">
        </div>
    </div>

    <script src="../shared/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('slide-container');
            const modalsContainer = document.getElementById('modals-container');
            const loader = document.getElementById('loader');

            try {
                const totalSlides = 30;
                let slidesHtml = '';

                const slidePromises = [];
                for (let i = 1; i <= totalSlides; i++) {
                    const slideNum = i.toString().padStart(2, '0');
                    slidePromises.push(
                        fetch('slides/slide' + slideNum + '.html')
                            .then(res => {
                                if (!res.ok) throw new Error(`HTTP error! status: ${res.status} for slide ${slideNum}`);
                                return res.arrayBuffer();
                            })
                            .then(buf => new TextDecoder('utf-8').decode(buf))
                    );
                }

                const slideTexts = await Promise.all(slidePromises);
                slidesHtml = slideTexts.join('\n');
                container.innerHTML = slidesHtml;

                // Execute scripts in injected slides
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });

                const modalResponse = await fetch('slides/modals.html');
                if (modalResponse.ok) {
                    const modalBuf = await modalResponse.arrayBuffer();
                    const modalText = new TextDecoder('utf-8').decode(modalBuf);
                    modalsContainer.innerHTML = modalText;
                }

                loader.classList.add('hidden');

                if (window.initApp) {
                    window.initApp();
                }

                // Render LaTeX math using KaTeX after DOM is fully loaded and slides injected
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(document.body, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            } catch (error) {
                console.error("Error loading presentation content:", error);
                loader.textContent = "Error al cargar la presentación. Verifica la consola.";
            }
        });
    </script>
</body>

</html>
