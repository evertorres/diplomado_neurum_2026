<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17. ML Supervisado — Redes Neuronales Artificiales (ANN)</title>
    <meta name="description"
        content="Módulo 17 del Diplomado Neurum 2026: Redes Neuronales Artificiales (ANN). Estructura, funcionamiento, entrenamiento y consideraciones prácticas.">
    <!-- Relative path to global styles -->
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        .slide-image {
            max-width: 100%;
            max-height: 55vh;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            margin: var(--space-md) auto;
            border: 1px solid #E2E8F0;
            display: block;
        }

        /* Loading indicator */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1.5rem;
            color: var(--color-primary);
            transition: opacity 0.5s;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Custom style additions for ANN Module */
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--space-md);
            font-size: 1.05rem;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .comparison-table th {
            background-color: var(--color-primary);
            color: white;
            padding: 14px 18px;
            font-family: 'Exo', sans-serif;
            text-align: left;
            font-weight: 600;
        }

        .comparison-table td {
            padding: 14px 18px;
            border-bottom: 1px solid #E2E8F0;
            color: var(--color-secondary);
        }

        .comparison-table tr:last-child td {
            border-bottom: none;
        }

        .comparison-table tr:hover {
            background-color: #F8FAFC;
        }

        .concept-card {
            background: white;
            padding: var(--space-md) var(--space-lg);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #E2E8F0;
            transition: all 200ms ease;
        }

        .concept-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--color-cta);
        }

        .equation-block {
            background: #F8FAFC;
            padding: var(--space-md);
            border-radius: 8px;
            border-left: 4px solid var(--color-cta);
            margin: var(--space-md) 0;
            width: 100%;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">Cargando presentación...</div>

    <div class="presentation-container">

        <div id="slide-container" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
            <!-- Slides will be loaded dynamically -->
        </div>

        <div class="slide-controls">
            <button class="control-btn" id="prevSlide" disabled title="Anterior">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <span class="slide-counter" id="slideCounter">1 / 22</span>
            <button class="control-btn" id="nextSlide" title="Siguiente">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

    </div>

    <div id="modals-container">
        <!-- Modals will be loaded dynamically -->
    </div>

    <div class="modal-overlay" id="global-image-modal">
        <div class="modal modal-image-wrapper">
            <button class="modal-close modal-image-close" title="Cerrar Imagen">&times;</button>
            <img src="" id="global-image-content" class="modal-image-content">
        </div>
    </div>

    <script src="../shared/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('slide-container');
            const modalsContainer = document.getElementById('modals-container');
            const loader = document.getElementById('loader');

            try {
                const totalSlides = 22;
                let slidesHtml = '';

                const slidePromises = [];
                for (let i = 1; i <= totalSlides; i++) {
                    const slideNum = i.toString().padStart(2, '0');
                    slidePromises.push(
                        fetch('slides/slide' + slideNum + '.html')
                            .then(res => res.arrayBuffer())
                            .then(buf => new TextDecoder('utf-8').decode(buf))
                    );
                }

                const slideTexts = await Promise.all(slidePromises);
                slidesHtml = slideTexts.join('\n');
                container.innerHTML = slidesHtml;

                // Execute scripts in injected slides
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });

                const modalResponse = await fetch('slides/modals.html');
                if (modalResponse.ok) {
                    const modalBuf = await modalResponse.arrayBuffer();
                    const modalText = new TextDecoder('utf-8').decode(modalBuf);
                    modalsContainer.innerHTML = modalText;
                }

                loader.classList.add('hidden');

                if (window.initApp) {
                    window.initApp();
                }

                // Render LaTeX math using KaTeX after DOM is fully loaded and slides injected
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(document.body, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            } catch (error) {
                console.error("Error loading presentation content:", error);
                loader.textContent = "Error al cargar la presentación. Verifica la consola.";
            }
        });
    </script>
</body>

</html>
