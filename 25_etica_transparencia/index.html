<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25. Ética, Transparencia, XAI y Directrices de Reporte en Salud</title>
    <meta name="description"
        content="Módulo 25 del Diplomado Neurum 2026: Ética en IA Médica, Principios FAIR, Explicabilidad (XAI), Validación Clínica y Directrices Internacionales de Reporte TRIPOD+AI y TRIPOD-LLM.">
    <!-- Relative path to global styles -->
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --color-ethics-teal: #0D9488;
            --color-ethics-cyan: #0891B2;
            --color-ethics-emerald: #059669;
            --color-ethics-navy: #0F172A;
            --color-ethics-indigo: #4F46E5;
            --color-ethics-purple: #7C3AED;
            --color-ethics-amber: #D97706;
            --color-ethics-rose: #E11D48;
        }

        /* Loading indicator */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F8FAFC;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1.5rem;
            color: var(--color-ethics-teal);
            font-family: 'Exo', sans-serif;
            font-weight: 600;
            transition: opacity 0.5s;
            gap: 1rem;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #CCFBF1;
            border-top: 5px solid var(--color-ethics-teal);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Grids */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-md);
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-md);
        }

        .agenda-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-md);
            width: 100%;
            margin-top: var(--space-md);
        }

        .agenda-card {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            padding: var(--space-md);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .agenda-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-ethics-teal);
            background: #F0FDFA;
        }

        .agenda-card .icon-container {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #CCFBF1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-sm);
            color: var(--color-ethics-teal);
        }

        .concept-card {
            background: white;
            padding: var(--space-md);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #E2E8F0;
            transition: all 200ms ease;
        }

        .concept-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--color-ethics-teal);
        }

        .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #F0FDFA;
            color: var(--color-ethics-teal);
            border: 1px solid #99F6E4;
        }

        .badge-tag.cyan {
            background: #ECFEFF;
            color: var(--color-ethics-cyan);
            border-color: #A5F3FC;
        }

        .badge-tag.emerald {
            background: #ECFDF5;
            color: var(--color-ethics-emerald);
            border-color: #A7F3D0;
        }

        .badge-tag.indigo {
            background: #EEF2FF;
            color: var(--color-ethics-indigo);
            border-color: #C7D2FE;
        }

        .badge-tag.purple {
            background: #F5F3FF;
            color: var(--color-ethics-purple);
            border-color: #DDD6FE;
        }

        .badge-tag.amber {
            background: #FFFBEB;
            color: var(--color-ethics-amber);
            border-color: #FDE68A;
        }

        .badge-tag.rose {
            background: #FFF1F2;
            color: var(--color-ethics-rose);
            border-color: #FECDD3;
        }

        .badge-tag.slate {
            background: #F8FAFC;
            color: #475569;
            border-color: #CBD5E1;
        }

        .table-custom {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
            background: white;
            box-shadow: var(--shadow-sm);
        }

        .table-custom th {
            background: #F1F5F9;
            color: #1E293B;
            padding: 10px 14px;
            text-align: left;
            font-family: 'Exo', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 1px solid #CBD5E1;
        }

        .table-custom td {
            padding: 10px 14px;
            border-bottom: 1px solid #E2E8F0;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .table-custom tr:last-child td {
            border-bottom: none;
        }

        .table-custom tr:hover {
            background: #F8FAFC;
        }

        /* Interactive Checklist and Tabs */
        .tab-button {
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Exo', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid #CBD5E1;
            background: white;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-button.active {
            background: var(--color-ethics-teal);
            color: white;
            border-color: var(--color-ethics-teal);
            box-shadow: var(--shadow-sm);
        }

        .interactive-checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .interactive-checklist-item:hover {
            background: #F0FDFA;
            border-color: #99F6E4;
        }

        .interactive-checklist-item input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--color-ethics-teal);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .quote-box {
            border-left: 4px solid var(--color-ethics-teal);
            background: #F0FDFA;
            padding: var(--space-md);
            border-radius: 0 10px 10px 0;
            font-style: italic;
            color: #134E4A;
        }

        .metric-pill {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 14px;
            border-radius: 10px;
            background: white;
            border: 1px solid #E2E8F0;
            box-shadow: var(--shadow-sm);
        }

        .metric-pill .metric-val {
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'Exo', sans-serif;
            color: var(--color-ethics-teal);
        }

        .metric-pill .metric-lbl {
            font-size: 0.75rem;
            color: #64748B;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <div>Cargando presentación de Ética, Transparencia y XAI...</div>
    </div>

    <div class="presentation-container">

        <div id="slide-container" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
            <!-- 12 Slides dynamically injected -->
        </div>

        <div class="slide-controls">
            <button class="control-btn" id="prevSlide" disabled title="Anterior (Flecha Izquierda)">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <span class="slide-counter" id="slideCounter">1 / 20</span>
            <button class="control-btn" id="nextSlide" title="Siguiente (Flecha Derecha)">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

    </div>

    <div id="modals-container">
        <!-- Modals dynamically injected -->
    </div>

    <script src="../shared/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('slide-container');
            const modalsContainer = document.getElementById('modals-container');
            const loader = document.getElementById('loader');

            try {
                const totalSlides = 20;

                const slidePromises = [];
                for (let i = 1; i <= totalSlides; i++) {
                    const slideNum = i.toString().padStart(2, '0');
                    slidePromises.push(
                        fetch('slides/slide' + slideNum + '.html')
                            .then(res => {
                                if (!res.ok) throw new Error(`HTTP error! status: ${res.status} for slide ${slideNum}`);
                                return res.arrayBuffer();
                            })
                            .then(buf => new TextDecoder('utf-8').decode(buf))
                    );
                }

                const slideTexts = await Promise.all(slidePromises);
                container.innerHTML = slideTexts.join('\n');

                // Execute scripts in injected slides
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });

                const modalResponse = await fetch('slides/modals.html');
                if (modalResponse.ok) {
                    const modalBuf = await modalResponse.arrayBuffer();
                    const modalText = new TextDecoder('utf-8').decode(modalBuf);
                    modalsContainer.innerHTML = modalText;
                }

                loader.classList.add('hidden');

                if (window.initApp) {
                    window.initApp();
                }

                // Render KaTeX math equations
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(document.body, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            } catch (error) {
                console.error("Error loading presentation content:", error);
                loader.textContent = "Error al cargar la presentación. Verifica la consola.";
            }
        });
    </script>
</body>

</html>
