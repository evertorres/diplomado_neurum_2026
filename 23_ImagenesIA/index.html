<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23. Generación de Imágenes con IA en Salud & Ecosistema Google Flow</title>
    <meta name="description"
        content="Módulo 23 del Diplomado Neurum 2026: Generación de imágenes con Inteligencia Artificial para la divulgación y educación en salud. Ingeniería de Prompts, herramientas 2026 (DaVinci, Google Flow, FLUX, Midjourney) y Laboratorio Interactivo de Prompts.">
    <!-- Relative path to global styles -->
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --color-health-cyan: #0891B2;
            --color-health-teal: #0D9488;
            --color-health-green: #059669;
            --color-health-dark: #0F172A;
            --color-accent-purple: #7C3AED;
            --color-accent-amber: #D97706;
        }

        .slide-image {
            max-width: 100%;
            max-height: 55vh;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            margin: var(--space-md) auto;
            border: 1px solid #E2E8F0;
            display: block;
        }

        /* Loading indicator */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F8FAFC;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1.5rem;
            color: var(--color-health-cyan);
            font-family: 'Exo', sans-serif;
            font-weight: 600;
            transition: opacity 0.5s;
            gap: 1rem;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #CFFAFE;
            border-top: 5px solid var(--color-health-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom UI Cards & Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-md);
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-md);
        }

        .agenda-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-md);
            width: 100%;
            margin-top: var(--space-md);
        }

        .agenda-card {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            padding: var(--space-md);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .agenda-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-health-cyan);
            background: #ECFEFF;
        }

        .agenda-card .icon-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #CFFAFE;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-sm);
            color: var(--color-health-cyan);
        }

        .concept-card {
            background: white;
            padding: var(--space-md);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #E2E8F0;
            transition: all 200ms ease;
        }

        .concept-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--color-health-cyan);
        }

        .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #ECFEFF;
            color: var(--color-health-cyan);
            border: 1px solid #A5F3FC;
        }

        .badge-tag.emerald {
            background: #ECFDF5;
            color: #059669;
            border-color: #A7F3D0;
        }

        .badge-tag.amber {
            background: #FFFBEB;
            color: #D97706;
            border-color: #FDE68A;
        }

        .badge-tag.purple {
            background: #F5F3FF;
            color: #7C3AED;
            border-color: #DDD6FE;
        }

        .badge-tag.rose {
            background: #FFF1F2;
            color: #E11D48;
            border-color: #FECDD3;
        }

        .badge-tag.slate {
            background: #F8FAFC;
            color: #475569;
            border-color: #CBD5E1;
        }

        .prompt-preview-box {
            background: #0F172A;
            color: #F8FAFC;
            padding: var(--space-md);
            border-radius: 12px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.92rem;
            line-height: 1.6;
            border: 1px solid #334155;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #1E293B;
            color: #A5F3FC;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn:hover {
            background: #0891B2;
            color: white;
            border-color: #0891B2;
        }

        .copy-btn.copied {
            background: #059669;
            color: white;
            border-color: #059669;
        }

        .tool-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
            background: white;
            box-shadow: var(--shadow-sm);
        }

        .tool-table th {
            background: #F1F5F9;
            color: #1E293B;
            padding: 12px 16px;
            text-align: left;
            font-family: 'Exo', sans-serif;
            font-weight: 600;
            border-bottom: 1px solid #CBD5E1;
        }

        .tool-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #E2E8F0;
            font-size: 0.9rem;
        }

        .tool-table tr:last-child td {
            border-bottom: none;
        }

        .tool-table tr:hover {
            background: #F8FAFC;
        }

        .interactive-selector {
            background: white;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.9rem;
            color: #1E293B;
            width: 100%;
            cursor: pointer;
        }

        .interactive-selector:focus {
            outline: 2px solid var(--color-health-cyan);
            border-color: transparent;
        }

        .prompt-builder-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
        }

        .element-chip {
            display: inline-block;
            padding: 4px 10px;
            background: #E0F2FE;
            color: #0369A1;
            border-radius: 6px;
            font-size: 0.82rem;
            margin: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #BAE6FD;
        }

        .element-chip:hover {
            background: #0891B2;
            color: white;
            border-color: #0891B2;
        }

        .element-chip.selected {
            background: #0284C7;
            color: white;
            font-weight: 600;
        }

        .visual-demo-card {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
            background: white;
            transition: transform 0.2s ease;
        }

        .visual-demo-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .visual-demo-header {
            background: #F8FAFC;
            padding: 10px 14px;
            font-weight: 600;
            border-bottom: 1px solid #E2E8F0;
            font-family: 'Exo', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <div>Cargando presentación de Generación de Imágenes con IA...</div>
    </div>

    <div class="presentation-container">

        <div id="slide-container" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
            <!-- 12 Slides dynamically injected -->
        </div>

        <div class="slide-controls">
            <button class="control-btn" id="prevSlide" disabled title="Anterior (Flecha Izquierda)">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <span class="slide-counter" id="slideCounter">1 / 12</span>
            <button class="control-btn" id="nextSlide" title="Siguiente (Flecha Derecha)">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

    </div>

    <div id="modals-container">
        <!-- Modals dynamically injected -->
    </div>

    <div class="modal-overlay" id="global-image-modal">
        <div class="modal modal-image-wrapper">
            <button class="modal-close modal-image-close" title="Cerrar Imagen">&times;</button>
            <img src="" id="global-image-content" class="modal-image-content" alt="Vista ampliada">
        </div>
    </div>

    <script src="../shared/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('slide-container');
            const modalsContainer = document.getElementById('modals-container');
            const loader = document.getElementById('loader');

            try {
                const totalSlides = 12;

                const slidePromises = [];
                for (let i = 1; i <= totalSlides; i++) {
                    const slideNum = i.toString().padStart(2, '0');
                    slidePromises.push(
                        fetch('slides/slide' + slideNum + '.html')
                            .then(res => {
                                if (!res.ok) throw new Error(`HTTP error! status: ${res.status} for slide ${slideNum}`);
                                return res.arrayBuffer();
                            })
                            .then(buf => new TextDecoder('utf-8').decode(buf))
                    );
                }

                const slideTexts = await Promise.all(slidePromises);
                container.innerHTML = slideTexts.join('\n');

                // Execute scripts in injected slides
                container.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });

                const modalResponse = await fetch('slides/modals.html');
                if (modalResponse.ok) {
                    const modalBuf = await modalResponse.arrayBuffer();
                    const modalText = new TextDecoder('utf-8').decode(modalBuf);
                    modalsContainer.innerHTML = modalText;
                }

                loader.classList.add('hidden');

                if (window.initApp) {
                    window.initApp();
                }

                // Global Image Modal Helper
                window.openImageModal = function(src) {
                    const globalModal = document.getElementById('global-image-modal');
                    const globalImg = document.getElementById('global-image-content');
                    if (globalModal && globalImg) {
                        globalImg.src = src;
                        if (window.openModal) {
                            window.openModal('global-image-modal');
                        } else {
                            globalModal.classList.add('active');
                        }
                    }
                };

                // Render KaTeX math equations
                if (typeof renderMathInElement === 'function') {
                    renderMathInElement(document.body, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            } catch (error) {
                console.error("Error loading presentation content:", error);
                loader.textContent = "Error al cargar la presentación. Verifica la consola.";
            }
        });
    </script>
</body>

</html>
