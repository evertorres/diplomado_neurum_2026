<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27. Interacción Humano Máquina y Usabilidad</title>
    <!-- Relative path to global styles -->
    <link rel="stylesheet" href="../shared/styles.css">
    <style>
        .slide-image {
            max-width: 100%;
            max-height: 55vh;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            margin: var(--space-md) auto;
            border: 1px solid #E2E8F0;
            display: block;
        }

        /* Loading indicator */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 1.5rem;
            color: var(--color-primary);
            transition: opacity 0.5s;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Tables */
        .custom-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--space-md);
            font-size: 0.95rem;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid #E2E8F0;
        }

        .custom-table th {
            background: var(--color-primary);
            color: white;
            padding: 12px 16px;
            text-align: left;
            font-family: 'Exo', sans-serif;
            font-weight: 600;
        }

        .custom-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #E2E8F0;
            color: var(--color-text);
            line-height: 1.5;
        }

        .custom-table tr:last-child td {
            border-bottom: none;
        }

        .custom-table tr:nth-child(even) {
            background-color: #F8FAFC;
        }

        /* Usability gallery scroll container */
        .usability-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--space-lg);
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding: var(--space-sm) var(--space-md);
        }

        .usability-card {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .usability-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-cta);
        }

        .usability-card img {
            max-width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 8px;
            cursor: zoom-in;
        }

        .usability-caption {
            font-size: 0.85rem;
            color: var(--color-secondary);
            margin-top: 8px;
            text-align: center;
            font-weight: 500;
        }

        /* Cognitive Diagram Blocks */
        .diag-block {
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            text-align: center;
            position: relative;
        }

        .diag-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-cta);
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">Cargando presentación...</div>

    <!-- Main Container -->
    <div class="presentation-container">

        <div id="slide-container" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
            <!-- Slides will be injected here -->
        </div>

        <!-- Navigation UI -->
        <div class="slide-controls">
            <button class="control-btn" id="prevSlide" disabled title="Anterior">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <span class="slide-counter" id="slideCounter">1 / 50</span>
            <button class="control-btn" id="nextSlide" title="Siguiente">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

    <div id="modals-container">
        <!-- Modals will be injected here -->
    </div>

    <!-- Global Image Modal -->
    <div class="modal-overlay" id="global-image-modal">
        <div class="modal modal-image-wrapper">
            <button class="modal-close modal-image-close" title="Cerrar Imagen">&times;</button>
            <img src="" id="global-image-content" class="modal-image-content" alt="Imagen ampliada">
        </div>
    </div>

    <!-- Global App Logic -->
    <script src="../shared/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('slide-container');
            const modalsContainer = document.getElementById('modals-container');
            const loader = document.getElementById('loader');

            try {
                // Determine number of slides (50 slides total)
                const totalSlides = 50;
                let slidesHtml = '';

                // Fetch all slides in parallel for speed
                const slidePromises = [];
                for (let i = 1; i <= totalSlides; i++) {
                    const slideNum = i.toString().padStart(2, '0');
                    slidePromises.push(fetch(`slides/slide${slideNum}.html`).then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status} al cargar slide${slideNum}.html`);
                        return res.text();
                    }));
                }

                const slideTexts = await Promise.all(slidePromises);
                slidesHtml = slideTexts.join('\n');
                container.innerHTML = slidesHtml;

                // Fetch modals
                try {
                    const modalResponse = await fetch('slides/modals.html');
                    if (modalResponse.ok) {
                        const modalText = await modalResponse.text();
                        modalsContainer.innerHTML = modalText;
                    }
                } catch(e) {
                    console.log('No modals loaded');
                }

                // Hide loader
                loader.classList.add('hidden');

                // Initialize Application Logic
                if (window.initApp) {
                    window.initApp();
                }
            } catch (error) {
                console.error("Error loading presentation content:", error);
                loader.textContent = "Error al cargar la presentación. Verifica la consola.";
            }
        });
    </script>
</body>

</html>
